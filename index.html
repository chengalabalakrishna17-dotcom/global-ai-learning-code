<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GLOBAL AI LEARNING</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#f4f7fb;
 color:#172033
}

header{
 position:sticky;
 top:0;
 z-index:100;
 background:#111827;
 color:white;
 padding:14px 20px;
 display:flex;
 align-items:center;
 gap:15px;
 flex-wrap:wrap
}

.logo{
 font-size:22px;
 font-weight:bold;
 color:#60a5fa
}

.search{
 flex:1;
 min-width:220px;
 padding:12px;
 border-radius:8px;
 border:0;
 outline:0
}

button{
 border:0;
 padding:11px 16px;
 border-radius:8px;
 cursor:pointer;
 font-weight:bold
}

.primary{
 background:#4f46e5;
 color:white
}

.secondary{
 background:#e5e7eb;
 color:#111827
}

.danger{
 background:#dc2626;
 color:white
}

.layout{
 display:flex;
 min-height:calc(100vh - 70px)
}

.sidebar{
 width:240px;
 background:#1e293b;
 color:white;
 padding:18px;
 position:sticky;
 top:70px;
 height:calc(100vh - 70px)
}

.sidebar button{
 width:100%;
 margin:5px 0;
 text-align:left;
 background:transparent;
 color:#cbd5e1
}

.sidebar button:hover{
 background:#3730a3;
 color:white
}

main{
 flex:1;
 padding:25px;
 max-width:1500px;
 margin:auto;
 width:100%
}

.hero{
 background:linear-gradient(135deg,#312e81,#7c3aed);
 color:white;
 padding:40px;
 border-radius:20px;
 margin-bottom:25px
}

.hero h1{
 font-size:45px;
 margin:0 0 10px
}

.hero p{
 font-size:18px;
 line-height:1.7
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
 gap:18px
}

.card{
 background:white;
 border:1px solid #e5e7eb;
 border-radius:15px;
 padding:20px;
 box-shadow:0 5px 20px #0000000d;
 margin-bottom:15px
}

.card h2,.card h3{
 margin-top:0
}

.icon{
 font-size:42px
}

.progress{
 width:100%;
 height:10px;
 background:#e5e7eb;
 border-radius:10px;
 overflow:hidden
}

.progressBar{
 height:100%;
 background:linear-gradient(90deg,#4f46e5,#9333ea);
 width:0%
}

.module{
 background:white;
 border:1px solid #ddd;
 border-radius:12px;
 margin:15px 0;
 overflow:hidden
}

.moduleTitle{
 padding:17px;
 background:#f8fafc;
 display:flex;
 justify-content:space-between;
 align-items:center
}

.lesson{
 padding:15px;
 border-top:1px solid #eee;
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center
}

.lesson:hover{
 background:#f8fafc
}

.completed{
 background:#ecfdf5
}

.badge{
 display:inline-block;
 background:#eef2ff;
 color:#4338ca;
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
 font-weight:bold
}

.lessonContent{
 line-height:1.8;
 font-size:16px
}

.code{
 background:#0f172a;
 color:#dbeafe;
 padding:18px;
 border-radius:10px;
 overflow:auto;
 white-space:pre-wrap;
 font-family:monospace
}

.video{
 width:100%;
 aspect-ratio:16/9;
 border:0;
 border-radius:12px
}

input,textarea,select{
 width:100%;
 padding:12px;
 border:1px solid #cbd5e1;
 border-radius:8px;
 margin:5px 0 15px
}

textarea{
 min-height:130px
}

label{
 font-weight:bold
}

.quiz{
 padding:18px;
 border:1px solid #e5e7eb;
 border-radius:12px;
 margin:12px 0
}

.quiz label{
 display:block;
 padding:9px;
 font-weight:normal
}

.stats{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:15px;
 margin-bottom:25px
}

.stat{
 background:white;
 padding:20px;
 border-radius:12px;
 border:1px solid #ddd
}

.stat strong{
 font-size:30px;
 display:block
}

.modal{
 position:fixed;
 inset:0;
 background:#0009;
 display:none;
 justify-content:center;
 align-items:center;
 padding:20px;
 z-index:200
}

.modal.show{
 display:flex
}

.modalBox{
 background:white;
 width:min(800px,100%);
 max-height:90vh;
 overflow:auto;
 padding:25px;
 border-radius:15px
}

.hidden{
 display:none
}

.empty{
 text-align:center;
 padding:50px;
 color:#64748b
}

.resource{
 border:1px dashed #94a3b8;
 padding:15px;
 border-radius:10px;
 margin:8px 0
}

@media(max-width:800px){
 .sidebar{display:none}
 main{padding:15px}
 .hero h1{font-size:32px}
 header{position:relative}
}
</style>
</head>
